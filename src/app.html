<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#f7f7fb" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0f0f1a" media="(prefers-color-scheme: dark)" />
		<meta name="color-scheme" content="light dark" />
		<script>
			// Applies a theme pinned in the footer before first paint; the system theme needs no script.
			try {
				var pinned = localStorage.getItem('vivesticker.theme');
				if (pinned === 'light' || pinned === 'dark') document.documentElement.dataset.theme = pinned;
			} catch (error) {
				// Storage blocked (private mode): the system theme applies.
			}
			// Chromium offers installation once; keep an offer that arrives before the app has loaded.
			addEventListener('beforeinstallprompt', function (event) {
				event.preventDefault();
				window.__installPrompt = event;
			});
		</script>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="viveSticker" />
		<meta name="mobile-web-app-capable" content="yes" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
